name: Wraith baseline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cargo build --release --locked
      - name: Run baseline
        uses: ./.github/actions/wraith
        with:
          binary: ./target/release/wraith
          config: examples/rag-agent/wraith.yaml
          samples: '5'
          save: baseline
      - name: Store exact-commit baseline
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wraith-baseline-${{ github.sha }}
          path: examples/rag-agent/.wraith/runs/baseline.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30
