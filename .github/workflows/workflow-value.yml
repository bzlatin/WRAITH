name: Wraith workflow integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'adapters/**'
      - 'examples/rag-agent/**'
      - 'examples/workflow-agent/**'
      - 'scripts/workflow-pilot.py'
      - 'scripts/maintained-pilot.py'
      - 'scripts/application-pilot.py'
      - 'scripts/historical-pilot.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/workflow-value.yml'
permissions:
  contents: read
jobs:
  check-native:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _wraith_base
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --workspace --locked
      - name: Check the exact base and candidate with trusted base scenarios
        run: |
          target/debug/wraith --config examples/rag-agent/wraith.yaml ci check \
            --base-config _wraith_base/examples/rag-agent/wraith.yaml \
            --jobs 2 --artifacts .wraith/pr-check --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: native-pr-evidence
          path: .wraith/pr-check/
          include-hidden-files: true
          if-no-files-found: warn
  workflow-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --workspace --locked
      - name: Reproduce the green-baseline feature, stability checks, and calibration
        run: python3 scripts/workflow-pilot.py reproduce --install --repeats 2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: workflow-study-evidence
          path: |
            .wraith/workflow-value/assessment.json
            .wraith/workflow-value/report.md
            .wraith/workflow-value/setup/*.stdout
            .wraith/workflow-value/setup/*.stderr
            .wraith/workflow-value/runs/**/native/report.html
            .wraith/workflow-value/runs/**/native/summary.md
            .wraith/workflow-value/runs/**/native/ci.json
          include-hidden-files: true
          if-no-files-found: warn
