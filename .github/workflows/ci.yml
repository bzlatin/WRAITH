name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Package and CI script tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Support application component tests
        working-directory: examples/support-agent
        run: python3 -m unittest discover -s tests -v
      - name: Offline RAG pilot
        run: python3 scripts/pilot.py --repeats 1
      - name: Local Qdrant ingestion verification
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --disable-pip-version-check -r examples/index-audit/requirements.txt
          python3 examples/index-audit/demo.py --wraith target/debug/wraith --output .wraith/index-ci
      - name: Verified LlamaIndex ingestion workflow
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --disable-pip-version-check -r examples/verified-ingestion/requirements.txt
          python3 examples/verified-ingestion/tests/test_workflow.py --wraith target/debug/wraith -v
          python3 examples/verified-ingestion/search.py --db .wraith/search-ci ingest --source examples/verified-ingestion/documents --output .wraith/ingestion-ci/first --wraith target/debug/wraith --compare-plain
          python3 examples/verified-ingestion/search.py --db .wraith/search-ci query 'refund payment'
          python3 examples/verified-ingestion/search.py --db .wraith/search-ci inspect --history .wraith/ingestion-ci --json .wraith/ingestion-ci/inspection.json
      - name: Qdrant server interruption and reader checks
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python3 examples/verified-ingestion/fetch_fixtures.py --output .wraith/qdrant-server-bin
          python3 examples/verified-ingestion/server_check.py --qdrant-binary .wraith/qdrant-server-bin/qdrant --source examples/verified-ingestion/documents --output .wraith/ingestion-server-ci --wraith target/debug/wraith
      - name: Upstream ingestion extension compatibility
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          python3 examples/verified-ingestion/upstream_check.py --prepare .wraith/upstream-ci-source
          python3 examples/verified-ingestion/upstream_check.py --upstream .wraith/upstream-ci-source --wraith target/debug/wraith --output .wraith/upstream-ci
      - name: Preserve ingestion evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ingestion-evidence
          path: |
            .wraith/index-ci/
            .wraith/ingestion-ci/
            .wraith/ingestion-server-ci/
            .wraith/upstream-ci/
            !.wraith/ingestion-server-ci/server/storage/**
            !.wraith/ingestion-server-ci/server/snapshots/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: TypeScript compilation
        working-directory: examples/typescript-agent
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Offline adapter demos
        run: python3 scripts/demo.py
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.87.0 --profile minimal
      - run: cargo +1.87.0 check --workspace --all-targets --locked
      - name: Verify dependency license notices
        run: python3 scripts/license-notices.py --check
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
