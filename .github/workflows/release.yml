name: Release binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: wraith
          - os: macos-14
            target: aarch64-apple-darwin
            binary: wraith
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: wraith
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: wraith.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package checksummed native binary
        shell: bash
        env:
          WRAITH_RELEASE_TARGET: ${{ matrix.target }}
          WRAITH_RELEASE_BINARY: ${{ matrix.binary }}
          WRAITH_RELEASE_EVENT: ${{ github.event_name }}
        run: |
          args=(--require-license)
          if [ "$WRAITH_RELEASE_EVENT" = push ]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python3 scripts/package-release.py \
            --binary "target/$WRAITH_RELEASE_TARGET/release/$WRAITH_RELEASE_BINARY" \
            --target "$WRAITH_RELEASE_TARGET" "${args[@]}"
      - name: Include installer
        shell: bash
        run: |
          # Upload identical bytes from every platform, including Windows checkouts.
          python3 -c "from pathlib import Path; Path('release/install.py').write_text(Path('scripts/install.py').read_text(encoding='utf-8'), encoding='utf-8', newline='\n')"
      - name: Smoke test extracted native archive
        shell: bash
        run: |
          for archive in release/*.tar.gz release/*.zip; do
            if [ -f "$archive" ]; then python3 scripts/smoke-package.py "$archive"; fi
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    if: ${{ github.event_name == 'push' }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WRAITH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The native jobs include the installer in their uploaded release directory.
          gh release create "$WRAITH_RELEASE_TAG" release/* --verify-tag --draft --generate-notes
