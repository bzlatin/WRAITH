name: Wraith upstream study
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/upstream-pilot.py'
      - 'scripts/workflow-pilot.py'
      - 'scripts/maintained-pilot.py'
      - 'scripts/application-pilot.py'
      - 'scripts/historical-pilot.py'
      - 'examples/workflow-agent/**'
      - 'docs/evidence/upstream-queue.json'
      - '.github/workflows/upstream-study.yml'
permissions:
  contents: read
jobs:
  upstream-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --workspace --locked
      - name: Reproduce the pinned upstream PR queue without provider calls
        run: python3 scripts/upstream-pilot.py --root .wraith/upstream-study reproduce --install
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: upstream-study-evidence
          path: |
            .wraith/upstream-study/assessment.json
            .wraith/upstream-study/report.md
            .wraith/upstream-study/runs/**/native/report.html
            .wraith/upstream-study/runs/**/native/summary.md
          include-hidden-files: true
          if-no-files-found: warn
